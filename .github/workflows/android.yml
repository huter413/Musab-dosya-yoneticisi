name: Android Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build both APKs
        run: gradle --no-daemon :app:assembleManagerDebug :app:assembleSkkLoaderDebug
      - name: Verify both APKs exist
        run: |
          test -s app/build/outputs/apk/manager/debug/app-manager-debug.apk
          test -s app/build/outputs/apk/skkLoader/debug/app-skkLoader-debug.apk
          file app/build/outputs/apk/manager/debug/app-manager-debug.apk
          file app/build/outputs/apk/skkLoader/debug/app-skkLoader-debug.apk
      - name: Upload MusabDosyaYoneticisi APK
        uses: actions/upload-artifact@v4
        with:
          name: MusabDosyaYoneticisi-debug
          path: app/build/outputs/apk/manager/debug/app-manager-debug.apk
      - name: Upload SKK Yükleyicisi APK
        uses: actions/upload-artifact@v4
        with:
          name: SKKYukleyicisi-debug
          path: app/build/outputs/apk/skkLoader/debug/app-skkLoader-debug.apk
