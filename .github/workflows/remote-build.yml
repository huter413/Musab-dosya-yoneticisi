name: Musab Remote Project Build
on:
  push:
    branches:
      - "main"
      - "musab-build-*"
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "build-input/**/source.zip"
      - "build-input/**/source.jar"
      - "build-input/**/material-source.zip"
      - "build-input/**/input.apk"
      - ".github/workflows/remote-build.yml"
jobs:
  build-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read build request
        id: cfg
        shell: bash
        run: |
          SOURCE=$(find build-input -type f \( -name source.zip -o -name source.jar \) 2>/dev/null | head -n 1 || true)
          if [ -n "$SOURCE" ]; then
            DIR=$(dirname "$SOURCE")
            [ -f "$DIR/config.json" ] || { echo "config.json bulunamadı"; exit 1; }
            TYPE=$(jq -r '.type // "APK"' "$DIR/config.json")
            SIGN=$(jq -r '.sign // false' "$DIR/config.json")
            JAVA=$(jq -r '.javaVersion // "Android"' "$DIR/config.json")
            TARGET=$(jq -r '.target // "Android"' "$DIR/config.json")
          else
            TYPE="APK"
            SIGN="false"
            JAVA="Android"
            TARGET="Android"
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "sign=$SIGN" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Select JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ contains(steps.cfg.outputs.java_version, '1.21') && '21' || contains(steps.cfg.outputs.java_version, '1.20') && '21' || contains(steps.cfg.outputs.java_version, '1.19') && '17' || contains(steps.cfg.outputs.java_version, '1.18') && '17' || contains(steps.cfg.outputs.java_version, '1.17') && '17' || contains(steps.cfg.outputs.java_version, '1.16') && '11' || '17' }}
      - name: Install Android SDK
        if: steps.cfg.outputs.type == 'APK'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Extract source
        run: |
          rm -rf workspace dist
          mkdir -p workspace dist
          if [ -n "${{ steps.cfg.outputs.source }}" ]; then
            unzip -q "${{ steps.cfg.outputs.source }}" -d workspace
          else
            shopt -s dotglob nullglob
            for ITEM in *; do
              [ "$ITEM" = "workspace" ] && continue
              cp -a "$ITEM" workspace/
            done
            rm -rf workspace/.git workspace/workspace
          fi
          if [ "$(find workspace -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ]; then
            FIRST=$(find workspace -mindepth 1 -maxdepth 1 -type d | head -n1)
            if [ -f "$FIRST/settings.gradle" ] || [ -f "$FIRST/settings.gradle.kts" ]; then
              shopt -s dotglob; cp -a "$FIRST"/. workspace/; rm -rf "$FIRST"
            fi
          fi
      - name: Build Android APK
        if: steps.cfg.outputs.type == 'APK'
        run: |
          if [ -f workspace/gradlew ]; then
            chmod +x workspace/gradlew
            (cd workspace && ./gradlew --no-daemon assembleManagerDebug assembleSkkLoaderDebug)
          else
            (cd workspace && gradle --no-daemon assembleManagerDebug assembleSkkLoaderDebug)
          fi
          APK_COUNT=$(find workspace -type f -path '*/build/outputs/apk/*/*.apk' | wc -l)
          echo "Bulunan APK sayısı: $APK_COUNT"
          [ "$APK_COUNT" -ge 2 ] || { echo "İki APK bekleniyordu"; find workspace -type f -path '*/build/outputs/apk/*/*.apk' -print; exit 20; }
          MANAGER_APK=$(find workspace -type f -path '*/build/outputs/apk/*/*.apk' | grep -Ei '/(manager|app).*(debug|release).*\.apk$' | head -n1 || true)
          SKK_APK=$(find workspace -type f -path '*/build/outputs/apk/*/*.apk' | grep -Ei '/.*skk.*(debug|release).*\.apk$' | head -n1 || true)
          if [ -z "$MANAGER_APK" ]; then
            MANAGER_APK=$(find workspace -type f -path '*/build/outputs/apk/*/*.apk' | grep -vi skk | head -n1 || true)
          fi
          if [ -z "$SKK_APK" ]; then
            SKK_APK=$(find workspace -type f -path '*/build/outputs/apk/*/*.apk' | grep -i skk | head -n1 || true)
          fi
          [ -n "$MANAGER_APK" ] || { echo "Musab Dosya Yöneticisi APK bulunamadı"; exit 21; }
          [ -n "$SKK_APK" ] || { echo "SKK Installer APK bulunamadı"; exit 22; }
          [ "$MANAGER_APK" != "$SKK_APK" ] || { echo "Manager ve SKK aynı APK seçildi"; exit 23; }
          cp "$MANAGER_APK" dist/musab-dosya-yoneticisi.apk
          cp "$SKK_APK" dist/skk-installer.apk
          echo "Manager: $MANAGER_APK"
          echo "SKK: $SKK_APK"
      - name: Sign APK
        if: steps.cfg.outputs.type == 'APK' && steps.cfg.outputs.sign == 'true'
        run: |
          keytool -genkeypair -v -keystore dist/musab-build.jks -storepass changeit -keypass changeit -alias musab -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Musab Build"
          for APK in dist/musab-dosya-yoneticisi.apk dist/skk-installer.apk; do
            BASE="${APK%.apk}"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$APK" "${BASE}-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks dist/musab-build.jks --ks-pass pass:changeit --key-pass pass:changeit --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "${BASE}-signed.apk" "${BASE}-aligned.apk"
            mv "${BASE}-signed.apk" "$APK"
            rm -f "${BASE}-aligned.apk"
          done
      - name: Build JAR
        if: steps.cfg.outputs.type == 'JAR'
        run: |
          if [ -f workspace/gradlew ]; then
            chmod +x workspace/gradlew
            (cd workspace && ./gradlew --no-daemon jar)
            JAR=$(find workspace -type f -path '*/build/libs/*.jar' | head -n1)
          elif [ -f workspace/build.gradle ] || [ -f workspace/build.gradle.kts ]; then
            (cd workspace && gradle --no-daemon jar)
            JAR=$(find workspace -type f -path '*/build/libs/*.jar' | head -n1)
          else
            rm -rf workspace/classes workspace/jar-root
            mkdir -p workspace/classes workspace/jar-root
            mapfile -t SOURCES < <(find workspace -type f -name '*.java' -not -path '*/classes/*')
            [ "${#SOURCES[@]}" -gt 0 ] || { echo "Java kaynak bulunamadı"; exit 30; }
            javac -d workspace/classes "${SOURCES[@]}"
            cp -a workspace/classes/. workspace/jar-root/
            find workspace -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.gif' -o -name '*.webp' -o -name '*.json' -o -name '*.xml' -o -name '*.properties' \) -not -path '*/classes/*' -not -path '*/jar-root/*' -exec sh -c 'f="$1"; rel="${f#workspace/}"; mkdir -p "workspace/jar-root/$(dirname "$rel")"; cp "$f" "workspace/jar-root/$rel"' _ {} \;
            if [ -f workspace/META-INF/MANIFEST.MF ]; then mkdir -p workspace/jar-root/META-INF; cp workspace/META-INF/MANIFEST.MF workspace/jar-root/META-INF/MANIFEST.MF; fi
            jar cf dist/output.jar -C workspace/jar-root .
            JAR=dist/output.jar
          fi
          [ -f "$JAR" ] || { echo "JAR çıktısı bulunamadı"; exit 31; }
          [ "$JAR" = "dist/output.jar" ] || cp "$JAR" dist/output.jar
      - name: Sign JAR
        if: steps.cfg.outputs.type == 'JAR' && steps.cfg.outputs.sign == 'true'
        run: |
          keytool -genkeypair -v -keystore dist/musab-jar.jks -storepass changeit -keypass changeit -alias musab -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Musab Build"
          jarsigner -keystore dist/musab-jar.jks -storepass changeit -keypass changeit dist/output.jar musab
          jarsigner -verify dist/output.jar
      - name: Build Material.bin from GitHub source
        if: hashFiles('build-input/**/material-source.zip') != ''
        shell: bash
        run: |
          set -e
          rm -rf material-tool material-source
          git clone --depth 1 https://github.com/ddf8196/MaterialBinTool.git material-tool
          mkdir material-source
          unzip -q "$(find build-input -type f -name material-source.zip | head -n1)" -d material-source
          (cd material-tool && chmod +x gradlew && ./gradlew --no-daemon shadowJar)
          TOOL=$(find material-tool/build -type f -name '*all*.jar' -o -name '*shadow*.jar' | head -n1)
          [ -n "$TOOL" ] || { echo "MaterialBinTool JAR bulunamadı"; exit 40; }
          INPUT=$(find material-source -type f -name '*.json' | head -n1)
          [ -n "$INPUT" ] || { echo "Material source JSON bulunamadı"; exit 41; }
          java -jar "$TOOL" -c "$INPUT" -o dist
          BIN=$(find dist -type f -name '*.material.bin' -o -name 'material.bin' | head -n1)
          [ -n "$BIN" ] || { echo "material.bin üretilemedi"; exit 42; }
          cp "$BIN" dist/material.bin

      - name: Decompile APK with Apktool
        if: hashFiles('build-input/**/input.apk') != ''
        shell: bash
        run: |
          set -e
          mkdir -p dist/apk-decompiled
          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          wget -q "$APKTOOL_URL" -O apktool.jar
          APK=$(find build-input -type f -name 'input.apk' | head -n1)
          java -jar apktool.jar d -f "$APK" -o dist/apk-decompiled
          echo "Patch=Hayır" > dist/apk-decompiled/.musab_patch_status

      - name: Write metadata
        if: always()
        run: |
          echo "Tür: ${{ steps.cfg.outputs.type }}" > dist/build-info.txt
          echo "Minecraft Java: ${{ steps.cfg.outputs.java_version }}" >> dist/build-info.txt
          echo "Hedef: ${{ steps.cfg.outputs.target }}" >> dist/build-info.txt
      - name: Upload result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musab-build-output
          path: dist/
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: musab-build-failure
          path: |
            dist/
            workspace/**/*.log
          if-no-files-found: warn
