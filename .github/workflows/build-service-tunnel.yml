name: Musab Build Service HTTP

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start HTTP build service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PORT: 8080
        run: |
          set -euo pipefail
          npm --prefix service install --omit=dev
          nohup node service/server.js > /tmp/musab-service.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health

      - name: Install cloudflared
        run: |
          set -euo pipefail
          sudo curl -L --fail --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Open temporary public HTTP tunnel
        run: |
          set -euo pipefail
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > /tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          [ -n "${URL:-}" ] || { cat /tmp/cloudflared.log; exit 1; }
          echo "HTTP_BUILD_SERVICE_URL=$URL" >> "$GITHUB_ENV"
          echo "Musab HTTP build service: $URL"
          curl -fsS "$URL/health"

      - name: Publish service URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -n \
            --arg url "$HTTP_BUILD_SERVICE_URL" \
            '{url:$url,state:"online",service:"musab-build-service",protocol:"http"}' \
            > service-url.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-url.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish temporary HTTP build service URL"
          git push origin HEAD:main

      - name: Keep HTTP service alive
        run: |
          set -euo pipefail
          trap 'printf "%s\n" "state=offline" > /tmp/offline-state' EXIT
          for i in $(seq 1 330); do
            if ! curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "Build service stopped unexpectedly."
              cat /tmp/musab-service.log || true
              exit 1
            fi
            sleep 60
          done

      - name: Mark service offline
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -n '{url:"",state:"offline",service:"musab-build-service",protocol:"http"}' > service-url.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-url.json
          git diff --cached --quiet && exit 0
          git commit -m "Mark temporary HTTP build service offline"
          git push origin HEAD:main
