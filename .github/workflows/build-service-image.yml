name: Musab Build Service Image

on:
  push:
    branches: ["main"]
    paths:
      - "service/**"
      - ".github/workflows/build-service-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/musab-build-service:latest

      - name: Image summary
        run: echo "Published ghcr.io/${{ github.repository_owner }}/musab-build-service:latest"
